<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queen Captivated Homestays — Accommodation in Ukhrul | Hotel &amp; Lodge in Ukhrul</title>
<meta name="description" content="Queen Captivated Homestays offers the best accommodation in Ukhrul. Browse and book cosy homestay rooms, hotel lodge in Ukhrul and lodging in Ukhrul — the best places to rest, all bookable online.">
<meta name="keywords" content="accommodation in Ukhrul, best places to rest, hotel lodge in Ukhrul, lodging in Ukhrul, best lodging in Ukhrul, lodge in Ukhrul">
<meta property="og:title" content="Queen Captivated Homestays — Accommodation in Ukhrul">
<meta property="og:description" content="Book the best lodging in Ukhrul online — homestay rooms, hotel lodges and guesthouses, hand-picked and easy to reserve.">
<meta property="og:type" content="website">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://queencaptivated.in/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LodgingBusiness",
  "name": "Queen Captivated Homestays",
  "description": "Best accommodation in Ukhrul — homestay rooms, hotel lodge in Ukhrul and lodging in Ukhrul, bookable online.",
  "email": "executive@queencaptivated.in",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Ukhrul",
    "addressRegion": "Manipur",
    "addressCountry": "IN"
  },
  "areaServed": "Ukhrul",
  "priceRange": "₹₹"
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7F0;
    --surface:#FFFFFF;
    --ink:#241F19;
    --muted:#8A8071;
    --primary:#1F4B43;
    --primary-light:#2F6358;
    --accent:#C6941A;
    --accent-soft:#F3E3BB;
    --danger:#B3402A;
    --danger-soft:#F6DFD6;
    --ok:#3E6B4F;
    --ok-soft:#DCEBE0;
    --border:#E6E0D2;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  a{color:inherit;}
  button{font-family:inherit;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ===== Top bar ===== */
  .topbar{
    background:var(--primary);
    color:#fff;
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .back-link{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.12);color:#fff;text-decoration:none;font-size:16px;transition:background .15s;flex-shrink:0;}
  .back-link:hover{background:rgba(255,255,255,0.22);}
  .brand .mark{
    width:34px;height:34px;border-radius:50%;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;color:var(--primary);
    font-size:16px;
  }
  .brand .name{font-family:'Fraunces',serif;font-size:20px;font-weight:600;letter-spacing:0.2px;}
  .brand .tag{font-size:11px;color:#D9E6E0;margin-top:-2px;}
  .navtabs{display:flex;gap:4px;background:rgba(255,255,255,0.1);padding:4px;border-radius:999px;}
  .navtabs button{
    border:none;background:transparent;color:#EAF2EE;
    padding:8px 16px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:500;
    transition:background .15s ease;
  }
  .navtabs button.active{background:var(--accent);color:var(--primary);font-weight:600;}
  .navtabs button:not(.active):hover{background:rgba(255,255,255,0.12);}
  .userbox{display:flex;align-items:center;gap:10px;font-size:13px;}
  .userbox .chip{background:rgba(255,255,255,0.14);padding:6px 12px;border-radius:999px;}
  .btn{
    border-radius:8px;border:1px solid transparent;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
    transition:transform .08s ease, background .15s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-light);}
  .btn-accent{background:var(--accent);color:var(--primary);}
  .btn-accent:hover{opacity:0.9;}
  .btn-ghost{background:transparent;color:var(--primary);border-color:var(--border);}
  .btn-ghost:hover{background:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{opacity:0.9;}
  .btn-light{background:rgba(255,255,255,0.16);color:#fff;}
  .btn-light:hover{background:rgba(255,255,255,0.26);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}

  main{flex:1;max-width:1180px;width:100%;margin:0 auto;padding:28px 24px 60px;}

  .hero{
    display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;
    margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:22px;
  }
  .hero h1{font-size:30px;margin:0 0 6px;font-weight:600;}
  .hero p{color:var(--muted);margin:0;max-width:520px;font-size:14.5px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .card .thumb{
    width:100%;aspect-ratio:4/3;background:var(--accent-soft) center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:13px;position:relative;
  }
  .card .thumb .count{position:absolute;bottom:8px;right:8px;background:rgba(36,31,25,.65);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px;}
  .card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .card .title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
  .card .loc{color:var(--muted);font-size:12.5px;}
  .card .price{font-size:15px;font-weight:700;color:var(--primary);margin-top:auto;}
  .card .price span{font-weight:400;color:var(--muted);font-size:12px;}
  .card .footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;}
  .badge-ok{background:var(--ok-soft);color:var(--ok);}
  .badge-warn{background:var(--danger-soft);color:var(--danger);}

  .empty{
    border:1px dashed var(--border);border-radius:var(--radius);padding:40px 20px;text-align:center;color:var(--muted);
    background:var(--surface);
  }

  /* forms */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--ink);}
  .field .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=tel],textarea,select{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--primary-light);outline-offset:1px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  form{display:flex;flex-direction:column;}

  .authwrap{max-width:400px;margin:20px auto;}
  .authtabs{display:flex;gap:6px;margin-bottom:18px;}
  .authtabs button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);}
  .authtabs button.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  .banner{border-radius:var(--radius);padding:14px 18px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:18px;}
  .banner-danger{background:var(--danger-soft);color:#7A2A1B;border:1px solid #E5B4A2;}
  .banner-ok{background:var(--ok-soft);color:#274D34;border:1px solid #BBD9C6;}
  .banner-accent{background:var(--accent-soft);color:#6B4E0C;border:1px solid #E4C778;}
  .banner b{font-weight:700;}

  .wallet-card{
    background:var(--primary);color:#fff;border-radius:14px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:20px;
  }
  .wallet-card .amt{font-family:'Fraunces',serif;font-size:34px;font-weight:600;}
  .wallet-card .amt.neg{color:#FFC9B8;}
  .wallet-card .label{font-size:12px;color:#CFE0D8;text-transform:none;letter-spacing:0.2px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:11.5px;}
  tr:last-child td{border-bottom:none;}
  .tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;overflow-x:auto;}

  .section-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin:34px 0 14px;}
  .subtabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .subtabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .subtabs button.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  .photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:10px;}
  .photogrid .ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border);}
  .photogrid .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .photogrid .ph .rm{position:absolute;top:3px;right:3px;background:rgba(36,31,25,.7);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;}
  .upload-box{border:1.5px dashed var(--border);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;background:#fff;}
  .upload-box:hover{border-color:var(--primary-light);}

  .modal-bg{position:fixed;inset:0;background:rgba(36,31,25,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .modal{background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:88vh;overflow:auto;padding:26px;}
  .modal h2{margin-top:0;font-size:20px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}

  .qr-box{text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;margin:12px 0;}
  .qr-box img{max-width:180px;border-radius:8px;}

  .gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px;border-radius:12px;overflow:hidden;margin-bottom:18px;}
  .gallery img{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery .main{grid-row:span 2;aspect-ratio:4/3.4;}
  .gallery .side{aspect-ratio:16/8;}
  @media(max-width:640px){.gallery{grid-template-columns:1fr;}.gallery .main{aspect-ratio:4/3;}.gallery .side{display:none;}}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .stat .n{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--primary);}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:2px;}

  footer{text-align:center;padding:20px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);}
  .link-btn{background:none;border:none;color:var(--primary);text-decoration:underline;cursor:pointer;font-size:inherit;padding:0;font-weight:600;}
  .muted{color:var(--muted);}
  .backlink{display:inline-block;margin-bottom:16px;font-size:13px;}
  .small{font-size:12px;}
  .flexrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2);}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* Set by the deployment build step (see root vercel.json) from the
   HOMESTAY_API_URL environment variable. Leave this exact placeholder
   string in place if editing by hand — the build script replaces it
   by exact match. */
window.QC_API_BASE = "https://your-homestay-backend.onrender.com";
</script>
<script>
/* =============================================================
   CONFIG — change this to your deployed backend URL before going live.
   e.g. const API_BASE = 'https://api.queencaptivated.in';
   Leave as-is for local testing against `npm start` in /backend.
   ============================================================= */
const API_BASE = window.QC_API_BASE || 'http://localhost:4000';

/* ============================= API HELPER ============================= */
async function api(path, { method = 'GET', body = null, auth = false, isForm = false } = {}) {
  const headers = {};
  if (auth && state.session) headers['Authorization'] = 'Bearer ' + state.session.token;
  if (!isForm && body) headers['Content-Type'] = 'application/json';
  const res = await fetch(API_BASE + path, {
    method,
    headers,
    body: isForm ? body : (body ? JSON.stringify(body) : undefined),
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status})`);
  return data;
}
function money(n) {
  const v = Math.round(n || 0);
  return (v < 0 ? '-' : '') + '₹' + Math.abs(v).toLocaleString('en-IN');
}
function esc(s) { return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function imgUrl(p) { return p ? (p.startsWith('http') ? p : API_BASE + p) : null; }

/* ============================= SESSION (persisted for a real deployed site) ============================= */
function loadSession() {
  try { return JSON.parse(localStorage.getItem('qc_session')); } catch (e) { return null; }
}
function saveSession(s) {
  if (s) localStorage.setItem('qc_session', JSON.stringify(s));
  else localStorage.removeItem('qc_session');
}

/* ============================= APP STATE ============================= */
const state = {
  role: 'customer',
  view: 'browse',
  session: loadSession(),   // {type, token, id, name, email}
  data: {},                 // per-view cache, populated by loaders before render
  activeRoomId: null,
  authMode: 'login',
  loading: true,
  _formPhotos: [],          // {kind:'existing', id, url} | {kind:'new', file, previewUrl}
};
if (state.session) state.role = state.session.type;

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(() => el.remove(), 2800);
}
function errToast(e) { toast(e && e.message ? e.message : 'Something went wrong. Please try again.'); }

/* ============================= NAVIGATION / DATA LOADING ============================= */
async function navigate() {
  state.loading = true;
  render();
  try {
    await loadForCurrentView();
  } catch (e) {
    errToast(e);
  }
  state.loading = false;
  render();
}

async function loadForCurrentView() {
  if (!state.data.settings) {
    state.data.settings = await api('/api/settings');
  }
  if (state.role === 'customer') {
    if (state.view === 'room-detail' && state.activeRoomId) {
      state.data.activeRoom = await api('/api/rooms/' + state.activeRoomId);
    } else if (state.view === 'my-bookings') {
      if (state.session && state.session.type === 'customer') {
        state.data.myBookings = await api('/api/bookings/mine', { auth: true });
      }
    } else {
      state.data.rooms = await api('/api/rooms');
    }
  } else if (state.role === 'landlord') {
    if (state.session && state.session.type === 'landlord') {
      state.data.landlordMe = await api('/api/account/me', { auth: true });
      if (state.view === 'rooms' || state.view === 'edit-room') {
        state.data.landlordRooms = await api('/api/rooms/mine/list', { auth: true });
      } else if (state.view === 'bookings') {
        state.data.landlordBookings = await api('/api/bookings/landlord/mine', { auth: true });
      } else if (state.view === 'dashboard' || state.view === 'browse') {
        const [rooms, bookings] = await Promise.all([
          api('/api/rooms/mine/list', { auth: true }),
          api('/api/bookings/landlord/mine', { auth: true }),
        ]);
        state.data.landlordRooms = rooms;
        state.data.landlordBookings = bookings;
      }
    }
  } else if (state.role === 'admin') {
    if (state.session && state.session.type === 'admin') {
      const view = state.view;
      if (view === 'landlords') state.data.adminLandlords = await api('/api/admin/landlords', { auth: true });
      else if (view === 'rooms') state.data.adminRooms = await api('/api/admin/rooms', { auth: true });
      else if (view === 'bookings') state.data.adminBookings = await api('/api/admin/bookings', { auth: true });
      else if (view === 'settlements') state.data.adminSettlements = await api('/api/admin/settlements', { auth: true });
      else if (view === 'settings') { /* uses state.data.settings, refreshed on demand after changes */ }
      else state.data.adminOverview = await api('/api/admin/overview', { auth: true });
    }
  }
}

/* ============================= RENDER ROOT ============================= */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderTopbar()}
    <main>${state.loading ? '<p class="muted">Loading…</p>' : renderMain()}</main>
    <footer>Queen Captivated Homestays — best accommodation in Ukhrul, hotel lodge in Ukhrul &amp; lodging in Ukhrul · Platform commission ${state.data.settings ? state.data.settings.commissionRate : 20}% per booking · Contact executive@queencaptivated.in</footer>
  `;
  bindEvents();
}

function renderTopbar() {
  const s = state.session;
  return `
  <div class="topbar">
    <div class="brand">
      <a href="/" class="back-link" aria-label="Back to Queen Captivated" title="Back to Queen Captivated">←</a>
      <div class="mark">QC</div>
      <div>
        <div class="name">Queen Captivated</div>
        <div class="tag">Homestays &amp; guesthouses</div>
      </div>
    </div>
    <div class="navtabs">
      <button data-role="customer" class="${state.role==='customer'?'active':''}">Browse &amp; Book</button>
      <button data-role="landlord" class="${state.role==='landlord'?'active':''}">Host Portal</button>
      <button data-role="admin" class="${state.role==='admin'?'active':''}">Admin</button>
    </div>
    <div class="userbox">
      ${ s && s.type===state.role ? `
        <span class="chip">${esc(s.name)}</span>
        <button class="btn btn-light btn-sm" id="logoutBtn">Log out</button>
      ` : `<span class="chip small">Not signed in</span>` }
    </div>
  </div>`;
}

function renderMain() {
  if (state.role === 'customer') return renderCustomer();
  if (state.role === 'landlord') return renderLandlord();
  if (state.role === 'admin') return renderAdmin();
}

/* ============================= CUSTOMER SIDE ============================= */
function renderCustomer() {
  const s = state.session && state.session.type === 'customer' ? state.session : null;
  if (state.view === 'room-detail' && state.activeRoomId) return renderRoomDetail();
  if (state.view === 'my-bookings') {
    if (!s) return renderAuth('customer');
    return renderCustomerBookings();
  }
  return `
    <div class="hero">
      <div>
        <h1>Accommodation in Ukhrul, booked in minutes</h1>
        <p>Queen Captivated is home to the best lodging in Ukhrul — handpicked homestay rooms, hotel lodges and guesthouses across town, all bookable online. Prices shown are per night.</p>
      </div>
      <div class="flexrow">
        ${ s ? `<button class="btn btn-ghost" id="toMyBookings">My bookings</button>` :
              `<button class="btn btn-primary" id="toAuth">Sign in / Register</button>` }
      </div>
    </div>
    ${renderRoomGrid()}
    <div class="section-title">Why book your stay in Ukhrul with us</div>
    <div class="grid">
      <div class="panel">
        <h3 style="margin-top:0;font-size:16px;">Best places to rest in Ukhrul</h3>
        <p class="small muted">From quiet homestay rooms to family-run guesthouses, we list the best places to rest in Ukhrul for travellers, officials and visiting families alike.</p>
      </div>
      <div class="panel">
        <h3 style="margin-top:0;font-size:16px;">Hotel &amp; lodge in Ukhrul</h3>
        <p class="small muted">Whether you're after a homestay or a hotel lodge in Ukhrul, every listing is verified by our team before it goes live.</p>
      </div>
      <div class="panel">
        <h3 style="margin-top:0;font-size:16px;">Easy online lodging in Ukhrul</h3>
        <p class="small muted">Compare the best lodging in Ukhrul, check availability and confirm your booking online — no phone calls needed.</p>
      </div>
    </div>
  `;
}

function renderRoomGrid() {
  const rooms = state.data.rooms || [];
  if (!rooms.length) return `<div class="empty">No homestays are listed yet. Please check back soon.</div>`;
  return `<div class="grid">
    ${rooms.map(r => {
      const cover = r.photos && r.photos[0] ? imgUrl(r.photos[0]) : null;
      return `
      <div class="card" data-room="${r.id}" style="cursor:pointer;">
        <div class="thumb">
          ${cover ? `<img src="${cover}" alt="${esc(r.title)} — accommodation in Ukhrul" loading="lazy" style="width:100%;height:100%;object-fit:cover;">` : '<span>No photo yet</span>'}
          ${ r.photos && r.photos.length>1 ? `<span class="count">${r.photos.length} photos</span>`:''}
        </div>
        <div class="body">
          <div class="title">${esc(r.title)}</div>
          <div class="loc">${esc(r.location)} · sleeps ${esc(r.maxGuests)}</div>
          <div class="footer-row">
            <div class="price">${money(r.price)}<span> / night</span></div>
            ${r.bookable ? `<span class="badge badge-ok">Available</span>` : `<span class="badge badge-warn">Unavailable</span>`}
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function renderRoomDetail() {
  const r = state.data.activeRoom;
  if (!r) return `<div class="empty">This listing is no longer available.</div>`;
  const photos = (r.photos && r.photos.length) ? r.photos.map(imgUrl) : [null];
  return `
    <button class="backlink link-btn" id="backToBrowse">&larr; Back to all homestays</button>
    <div class="gallery">
      <div class="main">${photos[0] ? `<img src="${photos[0]}" alt="${esc(r.title)}, ${esc(r.location)} — lodge in Ukhrul" loading="lazy" style="width:100%;height:100%;object-fit:cover;">` : ''}</div>
      ${photos.slice(1,3).map(p=>`<div class="side">${p?`<img src="${p}" alt="${esc(r.title)} interior — hotel lodge in Ukhrul" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`:''}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:26px;" class="detail-cols">
      <div>
        <h1 style="margin:0 0 4px;font-size:26px;">${esc(r.title)}</h1>
        <p class="muted" style="margin:0 0 14px;">${esc(r.location)} · Hosted by ${esc(r.hostName)} · sleeps up to ${esc(r.maxGuests)}</p>
        <p style="font-size:14px;">${esc(r.description)}</p>
        <p class="small muted">Host contact details are kept private and are shared by the platform once your booking is confirmed.</p>
      </div>
      <div class="panel">
        <div class="price" style="font-size:22px;margin-bottom:10px;">${money(r.price)}<span style="font-size:12px;"> / night</span></div>
        ${ r.bookable ? `<button class="btn btn-accent" id="openBookModal" style="width:100%;">Book now</button>`
          : `<div class="banner banner-danger" style="margin:0;">This homestay isn't currently bookable — the host has an unpaid commission balance or is temporarily unavailable.</div>`}
      </div>
    </div>
  `;
}

function renderCustomerBookings() {
  const mine = state.data.myBookings || [];
  return `
    <div class="hero"><div><h1>My bookings</h1><p>Track the status of your homestay bookings.</p></div></div>
    ${!mine.length ? `<div class="empty">You haven't made any bookings yet.</div>` : `
    <div class="tbl-wrap"><table>
      <tr><th>Homestay</th><th>Check-in</th><th>Check-out</th><th>Guests</th><th>Total</th><th>Status</th></tr>
      ${mine.map(b=>`<tr><td>${esc(b.roomTitle)}</td><td>${b.checkin}</td><td>${b.checkout}</td><td>${b.guests}</td><td>${money(b.total)}</td><td><span class="badge ${b.status==='Confirmed'?'badge-ok':'badge-warn'}">${b.status}</span></td></tr>`).join('')}
    </table></div>`}
  `;
}

/* ============================= AUTH ============================= */
function renderAuth(role) {
  const mode = state.authMode;
  const isLandlord = role === 'landlord';
  return `
    <div class="authwrap">
      <h1 style="text-align:center;font-size:24px;">${isLandlord?'Host portal':'Guest account'}</h1>
      <p class="muted" style="text-align:center;font-size:13px;margin-top:-6px;">${isLandlord?'List your homestay and manage bookings.':'Sign in to book a homestay.'}</p>
      <div class="authtabs">
        <button data-mode="login" class="${mode==='login'?'active':''}">Log in</button>
        <button data-mode="register" class="${mode==='register'?'active':''}">Register</button>
      </div>
      <div class="panel">
        <form id="authForm">
          ${mode==='register' ? `<div class="field"><label>Full name</label><input type="text" name="name" required></div>` : ''}
          <div class="field"><label>Email</label><input type="email" name="email" required></div>
          ${mode==='register' ? `<div class="field"><label>Phone</label><input type="tel" name="phone" required></div>` : ''}
          <div class="field"><label>Password</label><input type="password" name="password" required minlength="4"></div>
          <button class="btn btn-primary" type="submit">${mode==='register' ? 'Create account' : 'Log in'}</button>
        </form>
      </div>
    </div>
  `;
}

/* ============================= LANDLORD SIDE ============================= */
function renderLandlord() {
  const s = state.session && state.session.type === 'landlord' ? state.session : null;
  if (!s) return renderAuth('landlord');
  const l = state.data.landlordMe;
  if (!l) return `<p class="muted">Loading…</p>`;
  const balance = l.walletBalance || 0;
  const myRooms = state.data.landlordRooms || [];
  const myBookings = state.data.landlordBookings || [];
  const view = ['rooms','add-room','edit-room','bookings'].includes(state.view) ? state.view : 'dashboard';

  let body = '';
  if (view === 'rooms') body = renderLandlordRooms(myRooms);
  else if (view === 'add-room') { state._roomFormEditing = null; body = renderRoomForm(null); }
  else if (view === 'edit-room') { state._roomFormEditing = myRooms.find(r => r.id === state.activeRoomId) || null; body = renderRoomForm(state._roomFormEditing); }
  else if (view === 'bookings') body = renderLandlordBookings(myBookings);
  else body = renderLandlordDashboard(l, myRooms, myBookings);

  return `
    <div class="hero">
      <div><h1>Host dashboard</h1><p>Welcome back, ${esc(l.name)}.</p></div>
      <div class="subtabs">
        <button data-lview="dashboard" class="${view==='dashboard'?'active':''}">Overview</button>
        <button data-lview="rooms" class="${view==='rooms'?'active':''}">My listings</button>
        <button data-lview="bookings" class="${view==='bookings'?'active':''}">Bookings</button>
      </div>
    </div>
    ${ balance < 0 ? `
      <div class="banner banner-danger">
        <div>
          <b>Commission payment due: ${money(balance)}.</b> New bookings for your listings are paused until this is settled.
          Pay the amount using the platform's payment QR code, then submit a settlement request from your dashboard.
          <div style="margin-top:8px;"><button class="btn btn-danger btn-sm" id="openSettleModal">Pay now / submit settlement</button></div>
        </div>
      </div>` : ''}
    ${body}
  `;
}

function renderLandlordDashboard(l, myRooms, myBookings) {
  const balance = l.walletBalance || 0;
  const rate = state.data.settings ? state.data.settings.commissionRate : 20;
  return `
    <div class="wallet-card">
      <div>
        <div class="label">Commission wallet balance</div>
        <div class="amt ${balance<0?'neg':''}">${money(balance)}</div>
        <div class="label" style="margin-top:4px;">${balance<0 ? 'Amount you owe the platform (' + rate + '% commission per booking)' : 'You are up to date on commission payments.'}</div>
      </div>
      <button class="btn btn-accent" id="openSettleModal">Settle balance</button>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="n">${myRooms.length}</div><div class="l">Active listings</div></div>
      <div class="stat"><div class="n">${myBookings.length}</div><div class="l">Total bookings</div></div>
      <div class="stat"><div class="n">${money(myBookings.reduce((a,b)=>a+(b.total||0),0))}</div><div class="l">Gross booking value</div></div>
      <div class="stat"><div class="n">${money(myBookings.reduce((a,b)=>a+(b.commission||0),0))}</div><div class="l">Total commission charged</div></div>
    </div>
    <div class="section-title">Recent bookings</div>
    ${renderLandlordBookings(myBookings.slice(0,5))}
  `;
}

function renderLandlordRooms(rooms) {
  return `
    <div style="margin-bottom:14px;"><button class="btn btn-primary" id="addRoomBtn">+ Add a listing</button></div>
    ${!rooms.length ? `<div class="empty">You haven't added any listings yet. Add your first homestay room to start receiving bookings.</div>` :
    `<div class="grid">${rooms.map(r=>`
      <div class="card">
        <div class="thumb">${r.photos&&r.photos[0]?`<img src="${imgUrl(r.photos[0].url)}" alt="${esc(r.title)}" style="width:100%;height:100%;object-fit:cover;">`:'<span>No photo</span>'}</div>
        <div class="body">
          <div class="title">${esc(r.title)}</div>
          <div class="loc">${esc(r.location)}</div>
          <div class="price">${money(r.price)}<span> / night</span></div>
          <div class="flexrow" style="margin-top:8px;">
            <button class="btn btn-ghost btn-sm" data-editroom="${r.id}">Edit</button>
            <button class="btn btn-danger btn-sm" data-delroom="${r.id}">Delete</button>
          </div>
        </div>
      </div>`).join('')}</div>`}
  `;
}

function renderRoomForm(existing) {
  const r = existing || { title:'', location:'', description:'', price:'', maxGuests:2, photos:[] };
  state._formPhotos = (r.photos || []).map(p => ({ kind:'existing', id: p.id, url: imgUrl(p.url) }));
  // Note: /api/rooms/mine/list returns photos as plain URL strings; we need ids to allow deletion,
  // so for edit we fetch full detail with ids the first time the form renders.
  return `
    <div class="panel" style="max-width:560px;">
      <h2>${existing?'Edit listing':'Add a new listing'}</h2>
      <form id="roomForm">
        <div class="field"><label>Title</label><input type="text" name="title" value="${esc(r.title)}" required placeholder="e.g. Cosy garden-view homestay room"></div>
        <div class="row2">
          <div class="field"><label>Location</label><input type="text" name="location" value="${esc(r.location)}" required placeholder="e.g. Ukhrul, Manipur"></div>
          <div class="field"><label>Max guests</label><input type="number" name="maxGuests" value="${r.maxGuests}" min="1" required></div>
        </div>
        <div class="field"><label>Price per night (₹)</label><input type="number" name="price" value="${r.price}" min="0" required></div>
        <div class="field"><label>Description</label><textarea name="description" required>${esc(r.description)}</textarea></div>
        <div class="field">
          <label>Photos (up to 10)</label>
          <div id="photoGrid" class="photogrid"></div>
          <label class="upload-box" id="uploadBoxLabel" style="display:block;margin-top:8px;">
            Click to upload photos (JPG/PNG, max 10)
            <input type="file" id="photoInput" accept="image/*" multiple style="display:none;">
          </label>
        </div>
        <div class="flexrow" style="margin-top:6px;">
          <button class="btn btn-primary" type="submit">${existing?'Save changes':'Publish listing'}</button>
          <button class="btn btn-ghost" type="button" id="cancelRoomForm">Cancel</button>
        </div>
      </form>
    </div>
  `;
}

function renderLandlordBookings(bookings) {
  if (!bookings.length) return `<div class="empty">No bookings yet.</div>`;
  const rate = state.data.settings ? state.data.settings.commissionRate : 20;
  return `<div class="tbl-wrap"><table>
    <tr><th>Guest</th><th>Guest phone</th><th>Listing</th><th>Dates</th><th>Total</th><th>Commission (${rate}%)</th><th>Status</th></tr>
    ${bookings.map(b=>`<tr>
        <td>${esc(b.customerName)}</td>
        <td>${esc(b.customerPhone)}</td>
        <td>${esc(b.roomTitle)}</td>
        <td>${b.checkin} → ${b.checkout}</td>
        <td>${money(b.total)}</td>
        <td>${money(b.commission)}</td>
        <td><span class="badge badge-ok">${b.status}</span></td>
      </tr>`).join('')}
  </table></div>`;
}

/* ============================= ADMIN SIDE ============================= */
function renderAdmin() {
  const s = state.session && state.session.type === 'admin' ? state.session : null;
  if (!s) return renderAdminLogin();
  const view = ['overview','landlords','rooms','bookings','settlements','settings'].includes(state.view) ? state.view : 'overview';
  return `
    <div class="hero">
      <div><h1>Admin dashboard</h1><p>Manage hosts, listings, bookings and payment settings.</p></div>
      <div class="subtabs">
        <button data-aview="overview" class="${view==='overview'?'active':''}">Overview</button>
        <button data-aview="landlords" class="${view==='landlords'?'active':''}">Hosts</button>
        <button data-aview="rooms" class="${view==='rooms'?'active':''}">Listings</button>
        <button data-aview="bookings" class="${view==='bookings'?'active':''}">Bookings</button>
        <button data-aview="settlements" class="${view==='settlements'?'active':''}">Settlements</button>
        <button data-aview="settings" class="${view==='settings'?'active':''}">Payment QR &amp; settings</button>
      </div>
    </div>
    ${ view==='overview' ? renderAdminOverview() :
       view==='landlords' ? renderAdminLandlords() :
       view==='rooms' ? renderAdminRooms() :
       view==='bookings' ? renderAdminBookingsTable(state.data.adminBookings || []) :

}

function renderAdminLogin() {
  return `
    <div class="authwrap">
      <h1 style="text-align:center;font-size:24px;">Admin sign in</h1>
      <p class="muted" style="text-align:center;font-size:13px;margin-top:-6px;">Restricted to platform administrators.</p>
      <div class="panel">
        <form id="adminForm">
          <div class="field"><label>Admin email</label><input type="email" name="email" required value="executive@queencaptivated.in"></div>
          <div class="field"><label>Password</label><input type="password" name="password" required></div>
          <button class="btn btn-primary" type="submit">Log in</button>
        </form>
      </div>
    </div>

}

function renderAdminOverview() {
  const d = state.data.adminOverview || { landlordCount:0, roomCount:0, bookingCount:0, totalCommission:0, totalOwed:0 };
  return `
    <div class="stat-row">
      <div class="stat"><div class="n">${d.landlordCount}</div><div class="l">Hosts</div></div>

    <p class="muted small">Open the "Bookings" tab above to see the full list.</p>
  `;
}

function renderAdminLandlords() {
  const d = state.data.adminLandlords || [];
  return `
    <div style="margin-bottom:14px;"><button class="btn btn-primary" id="addLandlordBtn">+ Add host</button></div>
    <div class="tbl-wrap"><table>
      <tr><th>Name</th><th>Email</th><th>Phone</th><th>Wallet</th><th>Status</th><th></th></tr>
      ${d.map(l=>`
        <tr>
          <td>${esc(l.name)}</td><td>${esc(l.email)}</td><td>${esc(l.phone)}</td>
          <td style="color:${l.walletBalance<0?'var(--danger)':'var(--ok)'};font-weight:600;">${money(l.walletBalance||0)}</td>
          <td><span class="badge ${l.status==='blocked'?'badge-warn':'badge-ok'}">${l.status==='blocked'?'Disabled':'Active'}</span></td>
          <td class="flexrow">
            <button class="btn btn-ghost btn-sm" data-edit-landlord="${l.id}">Edit</button>
            <button class="btn btn-ghost btn-sm" data-adjust-wallet="${l.id}">Adjust wallet</button>
            <button class="btn btn-danger btn-sm" data-del-landlord="${l.id}">Delete</button>
          </td>
        </tr>`).join('') || `<tr><td colspan="6" class="muted">No hosts yet.</td></tr>`}
    </table></div>
  `;
}

function renderAdminRooms() {
  const d = state.data.adminRooms || [];
  return `<div class="tbl-wrap"><table>
    <tr><th>Listing</th><th>Host</th><th>Location</th><th>Price/night</th><th>Photos</th><th>Status</th></tr>
    ${d.map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.landlordName)}</td><td>${esc(r.location)}</td><td>${money(r.price)}</td><td>${r.photoCount}/10</td><td><span class="badge ${r.bookable?'badge-ok':'badge-warn'}">${r.bookable?'Bookable':'Blocked'}</span></td></tr>`).join('') || `<tr><td colspan="6" class="muted">No listings yet.</td></tr>`}
  </table></div>`;
}

function renderAdminBookingsTable(list) {
  return `<div class="tbl-wrap"><table>
    <tr><th>Guest</th><th>Listing</th><th>Host</th><th>Dates</th><th>Total</th><th>Commission</th></tr>
    ${list.map(b=>`<tr><td>${esc(b.customerName)}</td><td>${esc(b.roomTitle)}</td><td>${esc(b.landlordName)}</td><td>${b.checkin} → ${b.checkout}</td><td>${money(b.total)}</td><td>${money(b.commission)}</td></tr>`).join('') || `<tr><td colspan="6" class="muted">No bookings yet.</td></tr>`}
  </table></div>`;
}

function renderAdminSettlements() {
  const d = state.data.adminSettlements || [];
  return `<div class="tbl-wrap"><table>
    <tr><th>Host</th><th>Amount</th><th>Note</th><th>Status</th><th></th></tr>
    ${d.map(s=>`<tr>
        <td>${esc(s.landlordName)}</td><td>${money(s.amount)}</td><td>${esc(s.note||'')}</td>
        <td><span class="badge ${s.status==='Approved'?'badge-ok':'badge-warn'}">${s.status}</span></td>
        <td>${s.status==='Pending' ? `<button class="btn btn-primary btn-sm" data-approve-settle="${s.id}">Approve</button> <button class="btn btn-ghost btn-sm" data-reject-settle="${s.id}">Reject</button>` : ''}</td>
      </tr>`).join('') || `<tr><td colspan="5" class="muted">No settlement requests yet.</td></tr>`}
  </table></div>`;
}

function renderAdminSettings() {
  const set = state.data.settings;
  return `
    <div class="panel" style="max-width:520px;margin-bottom:20px;">
      <h2 style="margin-top:0;">Payment QR code</h2>
      <p class="small muted">This QR code is shown to guests when booking and to hosts when settling their commission balance.</p>
      ${ set.qrImageUrl ? `<div class="qr-box"><img src="${imgUrl(set.qrImageUrl)}"></div>` : `<div class="empty" style="margin-bottom:12px;">No QR code uploaded yet.</div>`}
      <label class="upload-box" style="display:block;">
        Click to upload / replace QR code
        <input type="file" id="qrInput" accept="image/*" style="display:none;">
      </label>
    </div>
    <div class="panel" style="max-width:520px;margin-bottom:20px;">
      <h2 style="margin-top:0;">Commission rate</h2>
      <form id="commissionForm" class="flexrow">
        <input type="number" name="rate" value="${set.commissionRate}" min="0" max="100" style="max-width:100px;">
        <button class="btn btn-primary" type="submit">Update rate (%)</button>
      </form>
    </div>
    <div class="panel" style="max-width:520px;">
      <h2 style="margin-top:0;">Change admin password</h2>
      <form id="pwForm">
        <div class="field"><label>New password</label><input type="password" name="password" minlength="4" required></div>
        <button class="btn btn-primary" type="submit">Update password</button>

/* ============================= MODALS ============================= */
function showModal(html) {
  document.getElementById('modal-root').innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal">${html}</div></div>`;
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalBg').onclick = (e) => { if (e.target.id === 'modalBg') closeModal(); };
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function bookingModalHtml(room) {
  return `
    <button class="modal-close" id="modalClose">&times;</button>
    <h2>Book ${esc(room.title)}</h2>
    <p class="small muted">Hosted in ${esc(room.location)} · host contact will be shared after booking is confirmed by the platform.</p>
    <form id="bookingForm">
      <div class="row2">
        <div class="field"><label>Check-in</label><input type="date" name="checkin" required></div>
        <div class="field"><label>Check-out</label><input type="date" name="checkout" required></div>
      </div>
      <div class="field"><label>Guests</label><input type="number" name="guests" min="1" max="${room.maxGuests}" value="1" required></div>
      <div id="bookingTotalBox" class="banner banner-accent" style="display:none;"></div>
      <button class="btn btn-accent" type="submit">Confirm booking</button>
    </form>
  `;
}

function settleModalHtml(landlord) {
  const set = state.data.settings;
  return `
    <button class="modal-close" id="modalClose">&times;</button>
    <h2>Settle commission balance</h2>
    <p class="small muted">Current balance: <b style="color:var(--danger);">${money(landlord.walletBalance||0)}</b></p>
    ${ set.qrImageUrl ? `<div class="qr-box"><img src="${imgUrl(set.qrImageUrl)}"><div class="small muted" style="margin-top:6px;">Scan to pay executive@queencaptivated.in</div></div>` : `<div class="banner banner-accent">The platform hasn't uploaded a payment QR code yet — please contact executive@queencaptivated.in directly.</div>`}
    <form id="settleForm">
      <div class="field"><label>Amount paid (₹)</label><input type="number" name="amount" min="1" required value="${Math.abs(landlord.walletBalance||0) || ''}"></div>
      <div class="field"><label>Note / payment reference (optional)</label><input type="text" name="note" placeholder="UPI ref no."></div>
      <button class="btn btn-primary" type="submit">Submit for approval</button>
    </form>
    <p class="small muted">Your booking access resumes once the admin approves this payment.</p>

}

function landlordFormModal(existing) {

      <button class="btn btn-primary" type="submit">${existing?'Save changes':'Create host account'}</button>
    </form>
  `;

function adjustWalletModal(landlord) {
  return `
    <button class="modal-close" id="modalClose">&times;</button>
    <h2>Adjust wallet — ${esc(landlord.name)}</h2>
    <p class="small muted">Current balance: <b>${money(landlord.walletBalance||0)}</b></p>
    <form id="adjustWalletForm">
      <div class="field"><label>Amount to add (use negative to deduct)</label><input type="number" name="amount" required></div>
      <button class="btn btn-primary" type="submit">Apply adjustment</button>
    </form>
  `;
}

/* ============================= EVENT BINDING ============================= */
function bindEvents() {
  document.querySelectorAll('.navtabs [data-role]').forEach(btn => {
    btn.onclick = () => { state.role = btn.dataset.role; state.view = 'browse'; state.authMode = 'login'; navigate(); };
  });
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.onclick = () => { state.session = null; saveSession(null); state.view = 'browse'; state.data = {}; navigate(); toast('Logged out'); };

  const toAuth = document.getElementById('toAuth'); if (toAuth) toAuth.onclick = () => { state.view = 'my-bookings'; navigate(); };
  const toMyBookings = document.getElementById('toMyBookings'); if (toMyBookings) toMyBookings.onclick = () => { state.view = 'my-bookings'; navigate(); };
  const backToBrowse = document.getElementById('backToBrowse'); if (backToBrowse) backToBrowse.onclick = () => { state.view = 'browse'; state.activeRoomId = null; navigate(); };
  document.querySelectorAll('[data-room]').forEach(card => {
    card.onclick = () => { state.activeRoomId = card.dataset.room; state.view = 'room-detail'; navigate(); };
  });
  const openBookModal = document.getElementById('openBookModal');
  if (openBookModal) openBookModal.onclick = () => {
    if (!state.session || state.session.type !== 'customer') { state.role = 'customer'; state.view = 'my-bookings'; navigate(); toast('Please sign in to book'); return; }
    const room = state.data.activeRoom;
    showModal(bookingModalHtml(room));
    bindBookingForm(room);
  };

  document.querySelectorAll('.authtabs [data-mode]').forEach(btn => { btn.onclick = () => { state.authMode = btn.dataset.mode; render(); }; });
  const authForm = document.getElementById('authForm'); if (authForm) authForm.onsubmit = handleAuthSubmit;
  const adminForm = document.getElementById('adminForm'); if (adminForm) adminForm.onsubmit = handleAdminLogin;

  document.querySelectorAll('[data-lview]').forEach(btn => { btn.onclick = () => { state.view = btn.dataset.lview; state.activeRoomId = null; navigate(); }; });
  const addRoomBtn = document.getElementById('addRoomBtn'); if (addRoomBtn) addRoomBtn.onclick = () => { state.view = 'add-room'; navigate(); };
  document.querySelectorAll('[data-editroom]').forEach(b => { b.onclick = () => { state.activeRoomId = b.dataset.editroom; state.view = 'edit-room'; navigate(); }; });
  document.querySelectorAll('[data-delroom]').forEach(b => { b.onclick = async () => {
    if (!confirm('Delete this listing?')) return;
    try { await api('/api/rooms/' + b.dataset.delroom, { method: 'DELETE', auth: true }); toast('Listing deleted'); navigate(); }
    catch (e) { errToast(e); }
  }; });
  const cancelRoomForm = document.getElementById('cancelRoomForm'); if (cancelRoomForm) cancelRoomForm.onclick = () => { state.view = 'rooms'; navigate(); };
  const roomFormEl = document.getElementById('roomForm'); if (roomFormEl) bindRoomForm(roomFormEl, state._roomFormEditing || null);

  const openSettleModal = document.getElementById('openSettleModal');
  if (openSettleModal) openSettleModal.onclick = () => {
    showModal(settleModalHtml(state.data.landlordMe));
    document.getElementById('settleForm').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api('/api/settlements', { method: 'POST', auth: true, body: { amount: Number(fd.get('amount')), note: fd.get('note') } });
        closeModal(); toast('Settlement submitted for admin approval'); navigate();
      } catch (err) { errToast(err); }
    };
  };

  document.querySelectorAll('[data-aview]').forEach(btn => { btn.onclick = () => { state.view = btn.dataset.aview; navigate(); }; });
  const addLandlordBtn = document.getElementById('addLandlordBtn');
  if (addLandlordBtn) addLandlordBtn.onclick = () => { showModal(landlordFormModal(null)); bindLandlordAdminForm(null); };
  document.querySelectorAll('[data-edit-landlord]').forEach(b => {
    b.onclick = () => {
      const l = (state.data.adminLandlords || []).find(x => x.id === b.dataset.editLandlord);
      showModal(landlordFormModal(l)); bindLandlordAdminForm(l);
    };
  });
  document.querySelectorAll('[data-del-landlord]').forEach(b => {
    b.onclick = async () => {
      if (!confirm('Delete this host? Their listings will also be removed.')) return;
      try { await api('/api/admin/landlords/' + b.dataset.delLandlord, { method: 'DELETE', auth: true }); toast('Host deleted'); navigate(); }
      catch (e) { errToast(e); }
    };
  });
  document.querySelectorAll('[data-adjust-wallet]').forEach(b => {
    b.onclick = () => {
      const l = (state.data.adminLandlords || []).find(x => x.id === b.dataset.adjustWallet);
      showModal(adjustWalletModal(l));
      document.getElementById('adjustWalletForm').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          await api('/api/admin/landlords/' + l.id + '/wallet-adjust', { method: 'POST', auth: true, body: { amount: Number(fd.get('amount')) } });
          closeModal(); toast('Wallet updated'); navigate();
        } catch (err) { errToast(err); }
      };
    };
  });
  document.querySelectorAll('[data-approve-settle]').forEach(b => {
    b.onclick = async () => {
      try { await api('/api/admin/settlements/' + b.dataset.approveSettle + '/approve', { method: 'POST', auth: true }); toast('Settlement approved'); navigate(); }
      catch (e) { errToast(e); }
    };
  });
  document.querySelectorAll('[data-reject-settle]').forEach(b => {
    b.onclick = async () => {
      try { await api('/api/admin/settlements/' + b.dataset.rejectSettle + '/reject', { method: 'POST', auth: true }); toast('Settlement rejected'); navigate(); }
      catch (e) { errToast(e); }
    };
  });

  const qrInput = document.getElementById('qrInput');
  if (qrInput) qrInput.onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const fd = new FormData(); fd.append('qr', file);
    try { await api('/api/admin/settings/qr', { method: 'POST', auth: true, isForm: true, body: fd }); state.data.settings = null; toast('QR code updated'); navigate(); }
    catch (err) { errToast(err); }
  };
  const commissionForm = document.getElementById('commissionForm');
  if (commissionForm) commissionForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try { await api('/api/admin/settings/commission', { method: 'PUT', auth: true, body: { rate: Number(fd.get('rate')) } }); state.data.settings = null; toast('Commission rate updated'); navigate(); }
    catch (err) { errToast(err); }
  };
  const pwForm = document.getElementById('pwForm');
  if (pwForm) pwForm.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try { await api('/api/admin/settings/password', { method: 'PUT', auth: true, body: { password: fd.get('password') } }); toast('Admin password updated'); e.target.reset(); }
    catch (err) { errToast(err); }
  };
}

function bindBookingForm(room) {
  const form = document.getElementById('bookingForm');
  const totalBox = document.getElementById('bookingTotalBox');
  function updateTotal() {
    const fd = new FormData(form);
    const ci = fd.get('checkin'), co = fd.get('checkout');
    if (ci && co) {
      const nights = Math.round((new Date(co) - new Date(ci)) / 86400000);
      if (nights > 0) { totalBox.style.display = 'block'; totalBox.innerHTML = `${nights} night(s) × ${money(room.price)} = <b>${money(nights*room.price)}</b>`; }
      else totalBox.style.display = 'none';
    }
  }
  form.querySelectorAll('input').forEach(i => i.addEventListener('change', updateTotal));
  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    try {
      await api('/api/bookings', { method: 'POST', auth: true, body: {
        roomId: room.id, checkin: fd.get('checkin'), checkout: fd.get('checkout'), guests: Number(fd.get('guests')),
      }});
      closeModal();
      state.role = 'customer'; state.view = 'my-bookings';
      toast('Booking confirmed!');
      navigate();
    } catch (err) { errToast(err); }
  };
}

function bindLandlordAdminForm(existing) {
  document.getElementById('landlordAdminForm').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const payload = { name: fd.get('name'), email: fd.get('email'), phone: fd.get('phone') };
    const password = fd.get('password');
    if (password) payload.password = password;
    try {
      if (existing) await api('/api/admin/landlords/' + existing.id, { method: 'PUT', auth: true, body: payload });
      else await api('/api/admin/landlords', { method: 'POST', auth: true, body: payload });
      closeModal(); toast(existing ? 'Host updated' : 'Host created'); navigate();
    } catch (err) { errToast(err); }
  };
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const role = state.role;
  const path = `/api/auth/${role}/${state.authMode === 'register' ? 'register' : 'login'}`;
  const payload = { email: fd.get('email'), password: fd.get('password') };
  if (state.authMode === 'register') { payload.name = fd.get('name'); payload.phone = fd.get('phone'); }
  try {
    const data = await api(path, { method: 'POST', body: payload });
    state.session = { type: role, token: data.token, id: data.user.id, name: data.user.name, email: data.user.email };
    saveSession(state.session);
    state.view = 'browse';
    toast(state.authMode === 'register' ? 'Account created — welcome!' : 'Welcome back, ' + data.user.name);
    navigate();
  } catch (err) { errToast(err); }
}

async function handleAdminLogin(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const data = await api('/api/auth/admin/login', { method: 'POST', body: { email: fd.get('email'), password: fd.get('password') } });
    state.session = { type: 'admin', token: data.token, id: 'admin', name: 'Admin', email: data.user.email };
    saveSession(state.session);
    state.view = 'overview';
    toast('Welcome, admin');
    navigate();
  } catch (err) { errToast(err); }
}

function bindRoomForm(form, editingRoom) {
  const isEdit = !!editingRoom;
  let originalExistingIds = [];
  if (isEdit) {
    const photos = editingRoom.photos || [];
    originalExistingIds = photos.map(p => p.id);
    state._formPhotos = photos.map(p => ({ kind: 'existing', id: p.id, url: imgUrl(p.url) }));
  }
  const photoGrid = document.getElementById('photoGrid');
  function renderPhotoGrid() {
    photoGrid.innerHTML = state._formPhotos.map((p, i) => `
      <div class="ph"><img src="${p.kind==='new'?p.previewUrl:p.url}"><button type="button" class="rm" data-rmphoto="${i}">&times;</button></div>
    `).join('');
    photoGrid.querySelectorAll('[data-rmphoto]').forEach(b => {
      b.onclick = () => { state._formPhotos.splice(Number(b.dataset.rmphoto), 1); renderPhotoGrid(); updateUploadLabel(); };
    });
  }
  function updateUploadLabel() {
    const box = document.getElementById('uploadBoxLabel');
    const remaining = 10 - state._formPhotos.length;
    box.style.display = remaining > 0 ? 'block' : 'none';
    if (box.firstChild) box.firstChild.textContent = `Click to upload photos (${remaining} remaining, max 10)`;
  }
  renderPhotoGrid(); updateUploadLabel();

  document.getElementById('photoInput').onchange = (e) => {
    const files = Array.from(e.target.files);
    const remaining = 10 - state._formPhotos.length;
    if (files.length > remaining) toast(`You can only add ${remaining} more photo(s) — limit is 10 per listing`);
    files.slice(0, remaining).forEach(file => {
      state._formPhotos.push({ kind: 'new', file, previewUrl: URL.createObjectURL(file) });
    });
    renderPhotoGrid(); updateUploadLabel();
    e.target.value = '';
  };

  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = new FormData();
    body.append('title', fd.get('title'));
    body.append('location', fd.get('location'));
    body.append('description', fd.get('description'));
    body.append('price', fd.get('price'));
    body.append('maxGuests', fd.get('maxGuests'));
    state._formPhotos.filter(p => p.kind === 'new').forEach(p => body.append('photos', p.file));

    try {
      if (isEdit) {
        const remainingIds = state._formPhotos.filter(p => p.kind === 'existing').map(p => p.id);
        const removePhotoIds = originalExistingIds.filter(id => !remainingIds.includes(id));
        body.append('removePhotoIds', JSON.stringify(removePhotoIds));
        await api('/api/rooms/' + state.activeRoomId, { method: 'PUT', auth: true, isForm: true, body });
        toast('Listing updated');
      } else {
        await api('/api/rooms', { method: 'POST', auth: true, isForm: true, body });
        toast('Listing published');
      }
      state.view = 'rooms'; state.activeRoomId = null;
      navigate();
    } catch (err) { errToast(err); }
  };
}

/* ============================= INIT ============================= */
navigate();
</script>
